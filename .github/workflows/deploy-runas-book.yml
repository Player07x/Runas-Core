name: Deploy Runas Book to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/runas-book/**"
      - "packages/runas-core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-runas-book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runas-book-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: "076845eb75724529d83e92307f7df356"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate shared core
        run: npm test --workspace=@runas/core && npm run typecheck --workspace=@runas/core
      - name: Build Runas Book
        run: npm run build:book
      - name: Verify static routes
        run: |
          test -f apps/runas-book/out/index.html
          test -f apps/runas-book/out/dm/index.html
          test -f apps/runas-book/out/manifest.webmanifest
          test -f apps/runas-book/out/favicon.svg
          test -f apps/runas-book/out/_worker.js
      - name: Deploy Runas Book
        working-directory: apps/runas-book
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          npx wrangler pages deploy out --project-name runas-book --branch main --commit-hash ${{ github.sha }} --commit-message "Automated Runas Book deployment" --commit-dirty=false
